<svg viewBox="0 0 680 400" width="680" height="400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>信奥赛道金字塔</title>
<desc>塔尖极少数人，中层陪跑的大多数，塔基是失去兴趣的孩子。塔尖固定，塔基一年比一年宽。</desc>

<text x="340" y="46" text-anchor="middle" font-size="15" font-weight="500" fill="#16295C">1984 起 · 四十二年 · 第 43 届</text>
<text x="340" y="68" text-anchor="middle" font-size="12" fill="#5F5E5A">一套极其成熟的选拔体系，也是一条极其拥挤的赛道</text>

<polygon points="332,96 348,96 358,160 322,160" fill="#16295C" stroke="#042C53" stroke-width="0.5"/>
<polygon points="322,160 358,160 386,252 294,252" fill="#85B7EB" stroke="#378ADD" stroke-width="0.5"/>
<polygon points="294,252 386,252 462,346 218,346" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5"/>

<line x1="360" y1="128" x2="470" y2="128" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="478" y="132" font-size="13" font-weight="500" fill="#042C53">塔尖 · 极少数人</text>

<line x1="374" y1="206" x2="470" y2="206" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="478" y="210" font-size="13" font-weight="500" fill="#185FA5">陪跑的大多数</text>

<line x1="430" y1="300" x2="470" y2="300" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="478" y="304" font-size="13" font-weight="500" fill="#5F5E5A">塔基 · 失去兴趣的孩子</text>

<text x="60" y="180" font-size="12" fill="#5F5E5A">塔尖能站几个人，</text>
<text x="60" y="200" font-size="12" fill="#5F5E5A">是固定的。</text>

<text x="60" y="280" font-size="12" fill="#5F5E5A">塔基一年</text>
<text x="60" y="300" font-size="12" fill="#5F5E5A">比一年宽。</text>

<rect x="120" y="362" width="440" height="30" rx="6" fill="#EEF3FC" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="340" y="381" text-anchor="middle" font-size="13" font-weight="500" fill="#16295C">多数孩子不是输在不够聪明，是这条路只允许极少数人赢</text>
</svg>
