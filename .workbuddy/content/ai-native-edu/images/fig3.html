<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#ffffff}</style></head>
<body>
<svg viewBox="0 0 680 380" width="680" height="380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AI 原生教育三步走</title>
<desc>第一步翻转课堂假如我来讲这节课，第二步真实世界的问题二十七个难题，第三步给教育一个出口白名单赛事和黑客松。终极目标是 AI 时代核心素养。</desc>

<text x="340" y="42" text-anchor="middle" font-size="15" font-weight="500" fill="#16295C">我们的三步走</text>

<rect x="40" y="70" width="180" height="120" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="98" text-anchor="middle" font-size="12" fill="#185FA5">第一步 · 入门</text>
<text x="130" y="124" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">假如我来讲这节课</text>
<text x="130" y="146" text-anchor="middle" font-size="12" fill="#5F5E5A">预习自己的教材</text>
<text x="130" y="166" text-anchor="middle" font-size="12" fill="#5F5E5A">做成可视化，站上讲台</text>

<rect x="250" y="70" width="180" height="120" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="98" text-anchor="middle" font-size="12" fill="#534AB7">第二步 · 进阶</text>
<text x="340" y="124" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">真实世界的问题</text>
<text x="340" y="146" text-anchor="middle" font-size="12" fill="#444441">马斯克星球学校 27 难题</text>
<text x="340" y="166" text-anchor="middle" font-size="12" fill="#444441">没有标准答案的那种</text>

<rect x="460" y="70" width="180" height="120" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="550" y="98" text-anchor="middle" font-size="12" fill="#0F6E56">第三步 · 出口</text>
<text x="550" y="124" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">给教育一个出口</text>
<text x="550" y="146" text-anchor="middle" font-size="12" fill="#085041">白名单赛事 · 黑客松</text>
<text x="550" y="166" text-anchor="middle" font-size="12" fill="#085041">作品放到真实世界面前</text>

<path d="M224 130 L244 130" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M434 130 L454 130" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>

<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<path d="M550 196 C550 236, 340 226, 340 252" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>

<rect x="40" y="256" width="600" height="52" rx="10" fill="#EEF3FC" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="340" y="278" text-anchor="middle" font-size="13" font-weight="500" fill="#16295C">终极目标：培养 AI 时代的核心素养</text>
<text x="340" y="298" text-anchor="middle" font-size="12" fill="#185FA5">培养探索欲 · 保护好奇心 · 在真实世界中解决问题的能力</text>

<text x="340" y="344" text-anchor="middle" font-size="12" fill="#5F5E5A">不筛掉谁，让每个孩子都有机会站上讲台</text>
</svg>
