<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#ffffff}</style></head>
<body>
<svg viewBox="0 0 680 356" width="680" height="356" xmlns="http://www.w3.org/2000/svg" role="img">
<title>信息学竞赛成为最优解的前提正在消失</title>
<desc>左侧：1984 年起四十二年，写代码是稀缺能力，需要翻越高墙，信奥是最优解。右侧：大模型之后，墙变成门槛。</desc>

<text x="180" y="44" text-anchor="middle" font-size="12" fill="#185FA5">1984 起 · 四十二年</text>
<text x="180" y="66" text-anchor="middle" font-size="14" font-weight="500" fill="#042C53">信奥 = 最优解</text>

<text x="500" y="44" text-anchor="middle" font-size="12" fill="#0F6E56">大模型之后</text>
<text x="500" y="66" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">前提，变了</text>

<path d="M142 240 L232 90" fill="none" stroke="#85B7EB" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="232" y="90" width="32" height="150" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<circle cx="130" cy="222" r="7" fill="#185FA5"/>
<line x1="130" y1="229" x2="130" y2="240" stroke="#185FA5" stroke-width="2"/>

<path d="M452 240 Q497 186 542 240" fill="none" stroke="#5DCAA5" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="470" y="215" width="32" height="25" rx="3" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<circle cx="440" cy="222" r="7" fill="#0F6E56"/>
<line x1="440" y1="229" x2="440" y2="240" stroke="#0F6E56" stroke-width="2"/>

<line x1="40" y1="240" x2="640" y2="240" stroke="#B4B2A9" stroke-width="0.5"/>

<text x="180" y="262" text-anchor="middle" font-size="12" fill="#185FA5">写出代码 = 稀缺能力</text>
<text x="180" y="280" text-anchor="middle" font-size="12" fill="#5F5E5A">要练几千道题才翻得过去</text>

<text x="500" y="262" text-anchor="middle" font-size="12" fill="#0F6E56">AI 几秒写出像样的代码</text>
<text x="500" y="280" text-anchor="middle" font-size="12" fill="#5F5E5A">墙还在，但成了门槛</text>

<rect x="40" y="300" width="600" height="36" rx="8" fill="#EEF3FC" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="340" y="318" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#16295C">不是编程不重要了 —— 是让它成为最优解的前提，正在消失</text>
</svg>
</body></html>
