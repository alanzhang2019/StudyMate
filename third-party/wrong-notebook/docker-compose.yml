services:
  wrong-notebook:
    image: wrong-notebook:latest
    container_name: wrong-notebook
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh:ro