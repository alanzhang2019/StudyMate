version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studymate-backend
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - studymate-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time defaults; runtime env_file below can override at request time.
        DEFAULT_MODEL: ${DEFAULT_MODEL:-openai:gpt-4o-mini}
        MISTAKE_OCR_MODEL: ${MISTAKE_OCR_MODEL:-openai:gpt-4o-mini}
    container_name: studymate-frontend
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - ./frontend/.env
    environment:
      - BACKEND_URL=http://backend:3000
    networks:
      - studymate-net
    restart: unless-stopped

networks:
  studymate-net:
    driver: bridge
