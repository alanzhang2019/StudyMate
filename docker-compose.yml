version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studymate-backend
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - studymate-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studymate-frontend
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - BACKEND_URL=http://backend:3000
    networks:
      - studymate-net
    restart: unless-stopped

networks:
  studymate-net:
    driver: bridge
