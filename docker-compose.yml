version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studymate-backend
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - studymate-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time defaults; runtime env_file below can override at request time.
        # IMPORTANT: these are baked into the server bundle by webpack's env
        # inlining. Whatever is here at `docker compose build` time is what
        # runs. Change at runtime via .env does NOT take effect — must rebuild.
        #
        # Default switched to kimi:deepseek/deepseek-v4-flash-20260731.
        # The user confirmed this exact model id (note the date suffix)
        # IS available on 七牛云's OpenAI-compatible endpoint
        # (https://api.qnaigc.com/v1). Earlier attempts used
        # `deepseek/deepseek-v4-flash` WITHOUT the date suffix, which
        # 七牛云 silently rejected with an empty 200 response. The
        # `kimi:` label is purely cosmetic — providers.ts registers
        # `kimi` as type `openai`, so the SDK still speaks OpenAI
        # protocol but reads KIMI_* env vars. Keep these in sync with
        # the `environment` block below AND with `frontend/.env`.
        DEFAULT_MODEL: ${DEFAULT_MODEL:-kimi:deepseek/deepseek-v4-flash-20260731}
        # OCR 必须走【视觉模型】。这里原本默认 moonshot-v1-8k，七牛云上没这个模型。
        MISTAKE_OCR_MODEL: ${MISTAKE_OCR_MODEL:-kimi:qwen-vl-max-2025-01-25}
        # Disable thinking mode. The deepseek-v4-flash model on 七牛云
        # ships with reasoning enabled by default and dumps its
        # "thinking" into a separate `reasoning_content` field. When
        # `maxOutputTokens` is 2500 (analyze-paper), all the budget
        # gets eaten by reasoning and the actual `content` comes
        # back empty → frontend gets "AI 返回为空". Verified by curl:
        # the model returns content correctly for short prompts but
        # burns the output budget on reasoning_content for long
        # JSON-schema prompts. Setting LLM_THINKING_DISABLED=true
        # forces the model to skip reasoning and write straight to
        # `content`.
        LLM_THINKING_DISABLED: ${LLM_THINKING_DISABLED:-true}
    container_name: studymate-frontend
    # Listen on 0.0.0.0 so the oi.aijiangti.cn reverse proxy (Singapore)
    # can reach us during the ICP filing window. Restrict via Tencent Cloud
    # security group to oi server IP only.
    ports:
      - "3001:3001"
    env_file:
      - ./frontend/.env
      - ./frontend/.env.local
    environment:
      - BACKEND_URL=http://backend:3000
      # --- 站点访问密码（可选，全站门禁）-----------------------------------------
      # 取值来自宿主机仓库根目录的 .env（与 ADMIN_* 同处，该文件不入库）。
      # 设置后全站需要输入访问码才能进入；留空 = 不启用门禁。
      #
      # ⚠️ 关键：这一行是必需的。此前 ACCESS_CODE 从未接入 compose，
      # 只在根目录 .env 里设置是【无效】的 —— 前端容器读不到该变量，
      # 门禁状态接口恒返回 enabled:false，于是"配了密码也能直接进"。
      #
      # ⚠️ 请勿把它写进 frontend/.env：environment 段在 env_file 之后合并，
      # 若此处展开为空字符串，会覆盖掉 env_file 里的值。
      # 改完必须重启容器生效：docker compose up -d frontend
      - ACCESS_CODE=${ACCESS_CODE}
      # --- 管理后台凭据（P0 安全加固，必配）--------------------------------------
      # 取值来自宿主机仓库根目录的 .env（该文件不入库）。
      # 缺失或强度不足时 /api/admin/login 直接 503 拒绝登录 ——
      # 不会再像以前那样回退到源码里写死的 admin/admin123。
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      # Allow oi.aijiangti.cn to embed us via iframe during ICP filing
      - ALLOWED_FRAME_ANCESTORS=https://oi.aijiangti.cn
      # SQLite database location. The default in lib/db.ts is
      # `/tmp/studymate/studymate.sqlite` — `/tmp` is ephemeral, so
      # every container recreate loses all user accounts, quiz
      # progress, and any other server-side state. Pointing the DB
      # at the same `/app/data` directory as the classroom JSONs
      # piggybacks on the named volume that already exists below.
      - STUDYMATE_DB_DIR=/app/data
      # Force these model vars at runtime so a stale value in
      # `frontend/.env` (e.g. "kimi:moonshotai/kimi-k2.5" which is
      # NOT in KIMI_MODELS) cannot silently break the CSP placement
      # AI recommender and other server-side LLM calls. `environment`
      # is merged AFTER `env_file`, so these values win.
      #
      # Use `kimi:` provider (NOT `openai:`) because the .env only
      # configures KIMI_API_KEY / KIMI_BASE_URL pointing at
      # https://api.qnaigc.com/v1 (七牛云). The `kimi` provider in
      # providers.ts is registered as type `openai`, so the SDK still
      # speaks OpenAI protocol — it just reads KIMI_* env vars. The
      # default model is `deepseek/deepseek-v4-flash-20260731`
      # (confirmed by user, IS available on 七牛云).
      #
      # ⚠️ OCR 必须是【视觉模型】。这里曾写死 `moonshot-v1-8k` —— 七牛云上
      #    根本没有这个模型（81 个模型里没有），于是 /api/mistake/session/extract
      #    每次都返回 "no available channels for model moonshot-v1-8k"，
      #    学生看到的是「这次没有看清楚题目」。2026-10-03 换成实测可用的
      #    `qwen-vl-max-2025-01-25`（发一张纯色图问颜色，能正确答出「红色」）。
      #    注意：`qwen3-vl-30b-a3b-instruct` / `qwen2.5-vl-72b-instruct` /
      #    `doubao-1.5-vision-pro` 当时都返回 502 upstream，别改回去。
      #
      # ⚠️ 文本模型必须【带日期后缀】。七牛云对不带后缀的
      #    `deepseek/deepseek-v4-flash` 返回的是【空 200】（不报错、内容为空），
      #    只有 `-20260731` 实测正常。课堂生成是文本驱动的 —— 题目文字由 OCR
      #    先抽成 problemText，原图只作为 source image 存着给播放器显示，
      #    所以这里用文本模型而不是视觉模型。
      #
      # 改完重启：docker compose up -d frontend
      - DEFAULT_MODEL=kimi:deepseek/deepseek-v4-flash-20260731
      - MISTAKE_OCR_MODEL=kimi:qwen-vl-max-2025-01-25
      - MISTAKE_CLASSROOM_MODEL=kimi:deepseek/deepseek-v4-flash-20260731
      # --- KIMI / 七牛云 密钥（必配，安全）---------------------------------------
      # ⚠️ 这里曾是明文密钥并已进入 git 历史（2026-10-03 移除）。该密钥必须
      #    视为已泄露：请到七牛云后台作废重签，再按下述方式注入新值。
      #
      # 取值来自宿主机仓库根目录的 .env（与 ADMIN_* 同处，该文件不入库）。
      # environment 段在 env_file 之后合并，因此这里的值会覆盖 frontend/.env。
      #
      # ⚠️ 根目录 .env 里【必须】有 KIMI_API_KEY，否则会展开成空字符串并覆盖掉
      #    frontend/.env 的有效值，导致所有服务端 LLM 调用失败。
      #    若你更希望只保留 frontend/.env 一份，直接删掉下面这行即可（env_file 生效）。
      # 改完重启：docker compose up -d frontend
      - KIMI_API_KEY=${KIMI_API_KEY}
      # Force thinking mode OFF at runtime. The deepseek-v4-flash
      # model on 七牛云 returns an empty `content` field when
      # thinking is enabled (it dumps its reasoning into a separate
      # `reasoning_content` field and exhausts the 2500-token output
      # budget). This is set as a build arg above for webpack
      # inlining, but we ALSO set it at runtime in case the env_file
      # (.env) re-enables it. See comment on the LLM_THINKING_DISABLED
      # build arg for the full story.
      - LLM_THINKING_DISABLED=true
    # Persist /app/data (classroom JSONs, mistake-sessions, generated audio
    # recordings, SQLite database, etc.) on a named volume. Without this,
    # every `docker compose up -d --force-recreate` destroys the writable
    # layer and erases all imported classrooms + user data. The first run
    # after this change is a one-time migration: existing in-container
    # data is copied out to the new volume on the server (see deploy
    # runbook).
    #
    # Bind mount `./frontend/data/classrooms` → `/app/data/classrooms`:
    # 课件 JSON 直接同步宿主机 git 工作区。新增/改名课件后只需
    # `git pull && docker compose restart frontend`，不再需要
    # `docker cp`。SQLite db 仍然落在 named volume 上，避免
    # 宿主用户写权限问题（Next.js 在容器内跑在非 root，写
    # 宿主机 bind 的 db 容易 EACCES）。
    #
    # Bind mount `./frontend/public` → `/app/public`:
    # 静态资源（图片 / PDF / 模型 / favicon 等）直接同步宿主机
    # git 工作区。换图/CSP 难度地图/打印 PDF 等不再需要
    # `git add + push + docker build`，直接覆盖文件后
    # `docker compose restart frontend` 即可（5 秒生效）。
    # 注意：替换 `next.config.js` 里通过 images.remotePatterns
    # 引用的远程域名资源不在本 volume 范围内。
    volumes:
      - ./frontend/data/classrooms:/app/data/classrooms
      # 作品介绍视频（老师后台上传）挂到宿主机，供 nginx 直出。
      # 背景：camp-videos 原本只落在命名卷 /app/data 里，nginx 容器读不到，
      # 所以视频只能走 Next.js 应用路由转发 —— 每次拖动都要 Node 进程
      # 参与读盘+回传，多人同时看视频会占应用内存。
      # 这里用与 entities/classrooms 相同的模式：先挂命名卷占住 /app/data，
      # 再把宿主机目录挂到其子路径上覆盖（Docker 按声明顺序叠加）。
      # 注意：容器内路径必须与 /app/data/camp-videos 完全一致，
      # 否则应用读写与 nginx 直出会看到两份不同的文件。
      - ./frontend/data/camp-videos:/app/data/camp-videos
      - ./frontend/public:/app/public
      - studymate-frontend-data:/app/data
    networks:
      - studymate-net
    restart: unless-stopped

networks:
  studymate-net:
    driver: bridge

# ⚠️ 数据保护红线（2026-09-18 作品视频 404 事故后新增）
# 本命名卷（compose 项目名 studymate 下磁盘实际名为 studymate_studymate-frontend-data）
# 是【唯一】存放 SQLite 数据库（studymate.sqlite）与作品封面（camp-covers/）的地方：
# 不在 git、不在宿主机普通目录，删除即永久丢失全部账号 / 学习进度 / 封面。
# 严禁以下操作（会删卷）：
#   - docker compose down -v        ← 带 -v 会删卷！重启只用 docker compose down（不带 -v）
#   - docker volume rm studymate_studymate-frontend-data
#   - docker volume prune           ← 容器停止后卷可能被判定"未使用"而清理
# 视频在宿主机 bind 目录 ~/studymate/frontend/data/camp-videos（已恢复 8 个，走普通目录
# 受主机备份保护）；DB 与封面只在卷里，必须定期备份（见下方 deploy runbook / 报警提醒）。
volumes:
  studymate-frontend-data:
