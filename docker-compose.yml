version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studymate-backend
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - studymate-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build-time defaults; runtime env_file below can override at request time.
        DEFAULT_MODEL: ${DEFAULT_MODEL:-openai:gpt-4o-mini}
        MISTAKE_OCR_MODEL: ${MISTAKE_OCR_MODEL:-openai:gpt-4o-mini}
    container_name: studymate-frontend
    # Listen on 0.0.0.0 so the oi.aijiangti.cn reverse proxy (Singapore)
    # can reach us during the ICP filing window. Restrict via Tencent Cloud
    # security group to oi server IP only.
    ports:
      - "3001:3001"
    env_file:
      - ./frontend/.env
      - ./frontend/.env.local
    environment:
      - BACKEND_URL=http://backend:3000
      # Allow oi.aijiangti.cn to embed us via iframe during ICP filing
      - ALLOWED_FRAME_ANCESTORS=https://oi.aijiangti.cn
    # Persist /app/data (classroom JSONs, mistake-sessions, generated audio
    # recordings, etc.) on a named volume. Without this, every
    # `docker compose up -d --force-recreate` destroys the writable layer
    # and erases all imported classrooms + user data. The first run after
    # this change is a one-time migration: existing in-container data is
    # copied out to the new volume on the server (see deploy runbook).
    volumes:
      - studymate-frontend-data:/app/data
    networks:
      - studymate-net
    restart: unless-stopped

networks:
  studymate-net:
    driver: bridge

volumes:
  studymate-frontend-data:
