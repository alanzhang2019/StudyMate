services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ai-mistake-api
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

  frontend:
    image: node:20-alpine
    container_name: ai-mistake-frontend
    working_dir: /app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ../frontend:/app
    command: ["sh","-lc","npm i -g pnpm@10.28.0 && pnpm install && pnpm build && pnpm exec next start -H 0.0.0.0 -p 3001"]
    ports:
      - "127.0.0.1:3001:3001"
