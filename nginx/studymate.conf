# StudyMate 生产 nginx 配置（aijiangti.cn）
#
# ⚠️ 本文件是「真实生效」的完整布局：80 只做 https 跳转，443 承载全部业务。
# 历史：曾把静态直出 location 写在一个只监听 80 的 server 块里，而 certbot 生成的
# sites-enabled/default 也有 aijiangti.cn:80 的 301 块且先加载 → 本文件的 server 块
# 被 nginx 静默忽略（nginx -t 只报 conflicting server name warning），直出从未生效。
# 2026-09-15 起改为本文件承载 80+443 完整配置，服务器上停用 sites-enabled/default
# 符号链接（备份为 default.bak-20260915）。
#
# 部署：sudo cp nginx/studymate.conf /etc/nginx/sites-enabled/studymate.conf
#       sudo nginx -t && sudo nginx -s reload

# ---------- 80: 全部 301 到 https ----------
server {
    listen 80;
    listen [::]:80;
    server_name aijiangti.cn www.aijiangti.cn;

    if ($host = www.aijiangti.cn) {
        return 301 https://$host$request_uri;
    }

    if ($host = aijiangti.cn) {
        return 301 https://$host$request_uri;
    }

    return 404;
}

# ---------- 443: 业务主块 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name aijiangti.cn www.aijiangti.cn;

    # 证书（certbot 续期只换 pem 文件，这些行不动）
    ssl_certificate /etc/letsencrypt/live/aijiangti.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aijiangti.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 老师后台上传作品介绍视频等大文件走 443 代理，保留 200M 上传限制
    client_max_body_size 200M;

    # ===== 课题视频直出（绕过 Next.js）=====
    # 背景：原先所有请求都走 location / -> Next.js:3001，而 Next.js 对 public/
    # 下的静态资源默认返回 Cache-Control: max-age=0，每次播放都要回源；
    # 叠加 proxy_buffering off，拖动进度条会反复触发缓冲。
    #
    # 这里让 nginx 直接读宿主机文件（docker-compose 把 ./frontend/public
    # 挂到容器 /app/public，同一份文件在宿主机上即可访问）：
    #   - nginx 原生支持 Range，拖动响应更快
    #   - 长缓存 + immutable，用户第二次打开同一集不再下载
    # 视频内容不变（文件名即课题 id，换片会换文件），缓存 30 天是安全的。
    location /videos/ {
        alias /home/ubuntu/studymate/frontend/public/videos/;
        sendfile on;
        tcp_nopush on;
        # Range（拖动播放的前提）由 nginx 静态模块默认提供（Accept-Ranges + 206），
        # 不要手工 add_header Accept-Ranges —— 会与自带的出现重复响应头。
        # 缓存策略只用 add_header 表达一次：不要再用 expires 指令（同名头互相覆盖）。
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        # 子 location 里的 add_header 会覆盖父级，COOP/COEP 需在此重复声明
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        autoindex off;
        # 文件不存在直接 404，不要回落到前端路由（避免返回 HTML 导致播放器解析失败）
        try_files $uri =404;
    }

    # ===== 作品介绍视频：改走 Next.js（方案 B，2026-09-18）=====
    # 删除原 nginx 直出块：原以为 docker-compose 把视频绑定挂载到宿主机
    # ./frontend/data/camp-videos，但实测 docker-compose 把命名卷
    # studymate-frontend-data 挂在 /app/data（声明在 camp-videos 绑定之后，
    # 覆盖了子路径绑定），上传路由实际把视频写进了「命名卷」里的
    # /app/data/camp-videos，宿主机目录始终为空 → 全部 404。封面因从未走
    # nginx 直出、一直由 Next.js 路由（app/api/camp/covers）处理，从不出问题。
    #
    # 现与封面完全统一：本块删除后，/api/camp/videos/* 回落到下方 location /
    # 经 proxy_pass 到 Next.js:3001，由 app/api/camp/videos/[filename]/route.ts
    # 处理。该路由已实现「流式 + RFC7233 Range（206）」+ 严格白名单/防穿越，
    # 无需挂载同步，一次根治。作品介绍视频非热点长视频，经 Next.js 的性能
    # 损失可忽略。docker-compose 里那条被覆盖的 camp-videos 绑定挂载已成死
    # 配置，可留可删（删需重建 frontend 容器，暂不动以免扩大改动面）。


    # ===== 深圳九年义务教育系列教材 PDF 直出（10 科 89 册，约 1.6GB）=====
    # 文件在宿主机 ./frontend/data/textbooks/（frontend/data 已 gitignore，不入 git；
    # GitHub 100MB 单文件硬限制也决定了大文件不能走仓库）。
    # 上传时已把中文原文件名改写为全 ASCII slug（映射见 frontend/lib/textbooks.ts），
    # 因此白名单可沿用上面的纯 ASCII 校验。PDF 内容不变（换版即换 slug），
    # 缓存 1 年 + immutable 是安全的。
    # 「/textbooks」页面本身不带斜杠，不匹配下面的前缀 location，正常走 Next.js。
    location = /textbooks/ {
        return 308 /textbooks;
    }

    location /textbooks/ {
        alias /home/ubuntu/studymate/frontend/data/textbooks/;
        sendfile on;
        tcp_nopush on;

        # 文件名白名单：slug 全小写字母数字连字符。不合规一律 404。
        if ($request_uri !~ "^/textbooks/[a-z0-9-]+\.pdf$") {
            return 404;
        }

        # Range 支持由 nginx 静态模块原生提供（浏览器内嵌 PDF 查看器按需拉取字节段）
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        autoindex off;
        try_files $uri =404;
    }

    # ===== /machine/ 已退役（2026-10-03）=====
    # 历史：这里曾代理到 127.0.0.1:3000 上的旧 backend（Express）——
    # 见 docs/ARCHITECTURE.md §12「backend/ 是僵尸目录」。后端废弃后，宿主 3000
    # 被同一套前端的旧副本占用（compose 项目 frontend / 容器 frontend-openmaic-1），
    # 而该容器 ENV PORT=3001、实际监听 3001，compose 却发布 3000:3000 ——
    # 宿主 3000 上没有任何进程应答，于是这条路由长期 502
    # （nginx error.log: recv() failed (104: Unknown error) while reading
    #   response header from upstream，不是 connection refused，别被误导）。
    #
    # 该副本已于 2026-10-03 退役（其数据卷 frontend_openmaic-data 自 09-12 建立
    # 起从未写入，4KB 空卷，无数据损失）。老路径改为跳到主应用的等价新路径，
    # 旧链接不会硬 404：
    #     /machine/health  -> /api/health   老的健康检查（deploy.sh 已同步改）
    #     /machine/<其它>  -> /<其它>       如 /machine/api/xxx -> /api/xxx
    # 若将来要恢复一条真实的反代，参考备份：
    #     /home/ubuntu/hlplatform-backups/20261003-155512-machine-retire/studymate.conf
    location = /machine/health {
        return 301 /api/health$is_args$args;
    }
    location ~ ^/machine/(.*)$ {
        return 301 /$1$is_args$args;
    }
    location = /machine {
        return 301 /$is_args$args;
    }

    # ===== 错题本 wrong-notebook（独立 Next.js 服务，容器 :3002）=====
    location /wrong-notebook {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering        off;
        proxy_request_buffering off;
        proxy_cache            off;
    }

    # ===== Frontend (Next.js) =====
    # also bumps timeouts for proxied /api/* calls made from server
    # components and long-running client fetches.
    # ---------- 后浪学习平台（hl-platform）子路径 /ai ----------
    location /ai {
        rewrite ^/ai/?$ / break;
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/javascript text/javascript text/css application/json;
        sub_filter '/api/' '/ai/api/';
        sub_filter '/js/' '/ai/js/';
        sub_filter '/app.css' '/ai/app.css';
        sub_filter_once off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        send_timeout          600s;
        proxy_buffering       off;
        proxy_request_buffering off;
        proxy_cache           off;
        # Cross-Origin-Opener-Policy + Cross-Origin-Embedder-Policy enable
        # SharedArrayBuffer in the browser. Required by ONNX Runtime Web 1.27.x
        # (the only WASM it ships is the *-threaded-* variant, which can't
        # initialize without SharedArrayBuffer). Next.js's own headers() config
        # already sets these, but we set them again at the nginx layer so the
        # production deployment works even if the Next.js upstream briefly
        # returns a response that lacks them (e.g. during a rolling restart).
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }
}
