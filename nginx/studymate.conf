server {
    listen 80;
    server_name aijiangti.cn www.aijiangti.cn;

    # 课题视频直出（绕过 Next.js）
    # 背景：原先所有请求都走 location / -> Next.js:3001，而 Next.js 对 public/
    # 下的静态资源默认返回 Cache-Control: max-age=0，每次播放都要回源；
    # 叠加 proxy_buffering off，拖动进度条会反复触发缓冲。
    #
    # 这里让 nginx 直接读宿主机文件（docker-compose 把 ./frontend/public
    # 挂到容器 /app/public，同一份文件在宿主机上即可访问）：
    #   - nginx 原生支持 Range，拖动响应更快
    #   - 长缓存 + immutable，用户第二次打开同一集不再下载
    # 视频内容不变（文件名即课题 id，换片会换文件），缓存 30 天是安全的。
    location /videos/ {
        alias /home/ubuntu/studymate/frontend/public/videos/;
        # 开启高效文件传输
        sendfile on;
        tcp_nopush on;
        # 支持 Range（拖动播放的前提）：nginx 的静态文件模块默认就会返回
        # Accept-Ranges: bytes 与 206 Partial Content，无需手工 add_header。
        # 之前这里显式 add_header Accept-Ranges bytes 导致该响应头重复出现两次
        # （nginx 自带一次 + add_header 一次），已删掉，保持响应干净。
        #
        # 缓存策略只用 add_header 表达一次：不要再用 expires 指令。
        # 原因：expires 会自动生成 Cache-Control，与 add_header 的同名头
        # 相互覆盖，最终生效哪条取决于书写顺序，极易踩坑。单写一条最稳。
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        # 注意：子 location 里的 add_header 会覆盖父级，所以 COOP/COEP
        # 需在此重复声明，避免视频响应与站点其它响应策略不一致。
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        # 只允许读文件，不列目录
        autoindex off;
        # 文件不存在直接 404，不要回落到前端路由（避免返回 HTML 导致播放器解析失败）
        try_files $uri =404;
    }

    # 作品介绍视频直出（老师后台上传的学生作品讲解视频）
    # 路径 `/api/camp/videos/<workId>.<ext>` 与前端 lib/server/camp-work-autogen.ts
    # 的 videoServeUrl() 一致。落盘位置经 docker-compose 绑定挂载到宿主机：
    #   ./frontend/data/camp-videos -> /app/data/camp-videos
    #
    # 为什么直出：视频动辄几十上百 MB，走 Next.js 应用路由的话每次
    # Range 分段请求都要 Node 进程读盘再回传；多人同时观看会占用
    # 应用内存与事件循环。交给 nginx 直接读文件，不经过 Node。
    #
    # ⚠️ 为什么用「前缀 location + if 白名单」而不是「正则 location + alias」：
    #   实测（nginx:alpine 容器逐条验证过）正则 location 下的 alias 是
    #   「整个匹配 URI 被替换成 alias 路径」，文件名会丢 → 一律 404。
    #   而前缀 location 下的 alias 保留后续路径段，行为正确。
    #   所以这里用前缀 location 拿到正确的路径拼接，再用 if 做文件名白名单。
    #   白名单正则与 route.ts 的校验保持一致（字母数字连字符 + 指定后缀）。
    location /api/camp/videos/ {
        alias /home/ubuntu/studymate/frontend/data/camp-videos/;
        sendfile on;
        tcp_nopush on;

        # 文件名白名单：不合规一律 404，不进入文件系统查找。
        # 用 $request_uri 而非 $uri —— 前者是未经解码的原始值，
        # 能挡住 %2e%2e%2f 这类编码穿越尝试。
        if ($request_uri !~ "^/api/camp/videos/[a-zA-Z0-9-]+\.(mp4|webm|mov|m4v)$") {
            return 404;
        }

        # Range 支持由 nginx 静态模块原生化提供（206 + Content-Range + Accept-Ranges）
        # 缓存策略只用 add_header 表达一次，不要写 expires（同名头会互相覆盖）
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # 子 location 的 add_header 会覆盖父级 —— COOP/COEP 必须重复声明
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        autoindex off;
        # 文件不存在直接 404，不回落成 HTML（播放器解析 HTML 会报错）
        try_files $uri =404;
    }

    # 深圳九年义务教育系列教材 PDF 直出（10 科 89 册，约 1.6GB）
    # 文件在宿主机 ./frontend/data/textbooks/（frontend/data 已 gitignore，不入 git；
    # GitHub 100MB 单文件硬限制也决定了大文件不能走仓库）。
    # 上传时已把中文原文件名改写为全 ASCII slug（映射见 frontend/lib/textbooks.ts 与
    # scripts/deploy-textbooks.sh），因此白名单可沿用 camp-videos 的纯 ASCII 校验。
    # PDF 内容不变（换版即换 slug），缓存 1 年 + immutable 是安全的。
    # 「/textbooks」页面本身不带斜杠，不匹配下面的前缀 location，正常走 Next.js。
    location = /textbooks/ {
        return 308 /textbooks;
    }

    location /textbooks/ {
        alias /home/ubuntu/studymate/frontend/data/textbooks/;
        sendfile on;
        tcp_nopush on;

        # 文件名白名单：slug 全小写字母数字连字符。不合规一律 404。
        # 用 $request_uri（未解码原始值）可挡 %2e%2e%2f 编码穿越。
        if ($request_uri !~ "^/textbooks/[a-z0-9-]+\.pdf$") {
            return 404;
        }

        # Range 支持由 nginx 静态模块原生提供（浏览器内嵌 PDF 查看器按需拉取字节段）
        # 缓存策略只用 add_header 表达一次，不要写 expires（同名头互相覆盖）
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # 子 location 的 add_header 会覆盖父级 —— COOP/COEP 必须重复声明
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        autoindex off;
        try_files $uri =404;
    }

    # API (backend) — long-running generation, TTS, image, model calls.
    # 600s gives multi-minute LLM+TTS+image pipelines room to finish;
    # default 60s cuts them off at 504 Gateway Time-out.
    location /machine/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        send_timeout          600s;
        # Streaming/SSE buffers: these routes emit NDJSON or chunked
        # responses (e.g. /api/generate/*, /api/chat). Default nginx
        # buffering waits for the full response before relaying, which
        # both delays the first byte and breaks streaming.
        proxy_buffering       off;
        proxy_request_buffering off;
        proxy_cache           off;
    }

    # Frontend (Next.js) — also bumps timeouts for proxied /api/* calls
    # made from server components and long-running client fetches.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 600s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        send_timeout          600s;
        proxy_buffering       off;
        proxy_request_buffering off;
        proxy_cache           off;
        # Cross-Origin-Opener-Policy + Cross-Origin-Embedder-Policy enable
        # SharedArrayBuffer in the browser. Required by ONNX Runtime Web 1.27.x
        # (the only WASM it ships is the *-threaded-* variant, which can't
        # initialize without SharedArrayBuffer). Next.js's own headers() config
        # already sets these, but we set them again at the nginx layer so the
        # production deployment works even if the Next.js upstream briefly
        # returns a response that lacks them (e.g. during a rolling restart).
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
    }
}
