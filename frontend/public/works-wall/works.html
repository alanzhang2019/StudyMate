<script>
// Search & sort interactions
const searchInput = document.getElementById('searchInput');
const sortLatest = document.getElementById('sortLatest');
const sortHot = document.getElementById('sortHot');
const wallGrid = document.getElementById('wallGrid');

sortLatest.addEventListener('click', () => {
  sortLatest.classList.add('active');
  sortLatest.setAttribute('aria-pressed','true');
  sortHot.classList.remove('active');
  sortHot.setAttribute('aria-pressed','false');
});

sortHot.addEventListener('click', () => {
  sortHot.classList.add('active');
  sortHot.setAttribute('aria-pressed','true');
  sortLatest.classList.remove('active');
  sortLatest.setAttribute('aria-pressed','false');
});

searchInput.addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.work-note').forEach(note => {
    const title = note.querySelector('h2')?.textContent.toLowerCase() || '';
    const desc = note.querySelector('p')?.textContent.toLowerCase() || '';
    const meta = note.querySelector('.work-note-meta span')?.textContent.toLowerCase() || '';
    const match = !q || title.includes(q) || desc.includes(q) || meta.includes(q);
    note.style.display = match ? '' : 'none';
  });
});
</script>
