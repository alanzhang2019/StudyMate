<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-label="AI讲题">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F7BFF"/>
      <stop offset="100%" stop-color="#6E5BFF"/>
    </linearGradient>
    <linearGradient id="chalkGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#1E1B4B" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Gradient rounded background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Subtle inner highlight -->
  <rect x="2" y="2" width="60" height="28" rx="12" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- Sparkle top-right -->
  <g transform="translate(50 12)" fill="#FFFFFF" fill-opacity="0.9">
    <path d="M0 -4 L0.8 -0.8 L4 0 L0.8 0.8 L0 4 L-0.8 0.8 L-4 0 L-0.8 -0.8 Z"/>
  </g>
  <g transform="translate(11 50)" fill="#FFFFFF" fill-opacity="0.55">
    <path d="M0 -2 L0.5 -0.5 L2 0 L0.5 0.5 L0 2 L-0.5 0.5 L-2 0 L-0.5 -0.5 Z"/>
  </g>

  <!-- "讲" character, geometric + balanced for 64x64 -->
  <g fill="url(#chalkGrad)" filter="url(#softShadow)">
    <!-- 讠 (left radical) -->
    <rect x="14" y="20" width="2.4" height="3.2" rx="0.6"/>
    <path d="M11.4 28.2 L19 28.2 L19 30.4 L16.5 30.4 L16.5 34.6 L19 34.6 L19 36.8 L11.4 36.8 Z"/>
    <!-- 井 (right body) -->
    <g transform="translate(24 22)">
      <!-- top horizontal -->
      <rect x="0" y="0" width="22" height="2.4" rx="0.6"/>
      <!-- bottom horizontal -->
      <rect x="0" y="13" width="22" height="2.4" rx="0.6"/>
      <!-- middle horizontal -->
      <rect x="3" y="6.6" width="16" height="2.2" rx="0.5"/>
      <!-- left vertical -->
      <rect x="3" y="0" width="2.2" height="20" rx="0.5"/>
      <!-- right vertical -->
      <rect x="16.8" y="0" width="2.2" height="20" rx="0.5"/>
    </g>
    <!-- 冖 (top roof accent dot for visual weight) -->
    <circle cx="35" cy="19" r="1.2" fill="#FFE066" fill-opacity="0.95"/>
  </g>

  <!-- Tiny chalk piece bottom-left (講+板书 visual cue) -->
  <g transform="translate(8 50) rotate(-22)">
    <rect x="0" y="0" width="6" height="1.6" rx="0.8" fill="#FFFFFF" fill-opacity="0.7"/>
  </g>
</svg>
