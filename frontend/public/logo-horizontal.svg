<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" aria-label="爱讲题">
  <defs>
    <linearGradient id="hBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F7BFF"/>
      <stop offset="100%" stop-color="#6E5BFF"/>
    </linearGradient>
    <linearGradient id="hChalk" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.82"/>
    </linearGradient>
  </defs>

  <!-- Icon mark (left) -->
  <g transform="translate(8 8)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#hBg)"/>
    <rect x="2" y="2" width="60" height="28" rx="12" fill="#FFFFFF" fill-opacity="0.08"/>
    <g transform="translate(50 12)" fill="#FFFFFF" fill-opacity="0.9">
      <path d="M0 -4 L0.8 -0.8 L4 0 L0.8 0.8 L0 4 L-0.8 0.8 L-4 0 L-0.8 -0.8 Z"/>
    </g>
    <g transform="translate(11 50)" fill="#FFFFFF" fill-opacity="0.55">
      <path d="M0 -2 L0.5 -0.5 L2 0 L0.5 0.5 L0 2 L-0.5 0.5 L-2 0 L-0.5 -0.5 Z"/>
    </g>
    <g fill="url(#hChalk)">
      <rect x="14" y="20" width="2.4" height="3.2" rx="0.6"/>
      <path d="M11.4 28.2 L19 28.2 L19 30.4 L16.5 30.4 L16.5 34.6 L19 34.6 L19 36.8 L11.4 36.8 Z"/>
      <g transform="translate(24 22)">
        <rect x="0" y="0" width="22" height="2.4" rx="0.6"/>
        <rect x="0" y="13" width="22" height="2.4" rx="0.6"/>
        <rect x="3" y="6.6" width="16" height="2.2" rx="0.5"/>
        <rect x="3" y="0" width="2.2" height="20" rx="0.5"/>
        <rect x="16.8" y="0" width="2.2" height="20" rx="0.5"/>
      </g>
      <circle cx="35" cy="19" r="1.4" fill="#FFE066"/>
    </g>
  </g>

  <!-- Wordmark (right) -->
  <g transform="translate(86 0)">
    <!-- Primary Chinese name -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
          font-size="32" font-weight="800" fill="#1E1B4B" letter-spacing="2">爱讲题</text>
    <!-- Secondary English name -->
    <text x="2" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" font-weight="500" fill="#6E5BFF" letter-spacing="1.5">爱讲题 · 用户可创建个人学习课件</text>
  </g>
